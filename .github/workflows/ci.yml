name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - name: Schemas and fixtures are valid JSON
        run: for f in schemas/*.json conformance/fixtures/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Site in docs/ is up to date
        run: |
          python tools/build_site.py
          git diff --exit-code -I 'Last updated' -- docs/
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "jsonschema>=4.20" build
      - run: python -m unittest discover -s tests
      - name: The built wheel serves the spec
        run: |
          python -m build --wheel
          pip install dist/*.whl
          cd /tmp && printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"osa_get_section","arguments":{"section":"6.3"}}}' | open-semantic-agent | grep -q "Semantic dedupe"
